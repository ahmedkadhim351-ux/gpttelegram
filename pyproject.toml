[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "media-telegram-bot"
version = "0.1.0"
description = "Telegram bot that downloads videos and audio from YouTube, TikTok, Instagram, X, Reddit, Facebook and 1500+ other sites via yt-dlp."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ahmed Kadhim" }]
keywords = ["telegram", "bot", "yt-dlp", "downloader", "youtube", "tiktok", "instagram"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
]
dependencies = [
    "python-telegram-bot[rate-limiter]>=21.0,<22",
    "yt-dlp>=2024.10.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5.0",
]

[project.scripts]
media-bot = "bot.__main__:main"

[tool.setuptools.packages.find]
include = ["bot*"]
exclude = ["tests*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = [
    "E501",   # handled by formatter
    "RUF001", # ambiguous Cyrillic characters are intentional in Russian UI strings
    "RUF002", # idem, in docstrings
    "RUF003", # idem, in comments
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]
